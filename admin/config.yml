backend:
  name: github
  repo: szaboleonardhenrik/atlaszkifozde
  branch: main
  commit_messages:
    update: 'Menü frissítés: {{collection}} ({{author-login}})'

# A CMS-ből feltöltött képek helye
media_folder: assets/img
public_folder: /assets/img

locale: hu
publish_mode: simple

collections:
  - name: menu
    label: Heti menü
    files:
      - name: hetek
        label: Heti menü
        file: data/menu.json
        description: >-
          Itt lehet átírni a heti menüt. A legfelső hét az, amelyik a
          honlapon kiemelve látszik, ha a mai nap beleesik. A weboldal 1-2 percen
          belül magától frissül.
        fields:
          - name: arak
            label: Árak
            widget: object
            fields:
              - { name: napi_menu, label: Napi menü ára (Ft), widget: number, value_type: int, min: 0 }
              - { name: heti_befizetes, label: Heti befizetés esetén (Ft/nap), widget: number, value_type: int, min: 0 }
              - { name: megjegyzes, label: Megjegyzés az árakhoz, widget: string, required: false }
          - name: hetek
            label: Hetek
            label_singular: hét
            widget: list
            summary: '{{fields.kezdes}}'
            fields:
              - name: kezdes
                label: A hét hétfői dátuma
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                format: YYYY-MM-DD
                hint: Mindig a hét HÉTFŐJÉT add meg, pl. 2026-08-17.
              - name: napok
                label: Napok
                label_singular: nap
                widget: list
                summary: '{{fields.nap}} – {{fields.foetel}}'
                fields:
                  - name: nap
                    label: Nap
                    widget: select
                    options: ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap']
                  - { name: leves, label: Leves, widget: string, required: false }
                  - { name: foetel, label: Főétel, widget: string }
                  - { name: ar, label: Ár (Ft), widget: number, value_type: int, min: 0, default: 2290 }
